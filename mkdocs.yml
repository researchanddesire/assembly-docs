site_name: Research and Desire — Assembly Docs
# GitHub Pages for now; switch to https://ohai.researchanddesire.com/ at cutover
# (and add a CNAME via the Pages custom-domain setting).
site_url: https://researchanddesire.github.io/assembly-docs/
repo_url: https://github.com/researchanddesire/assembly-docs
repo_name: assembly-docs

# Product assembly guides use sibling asset paths like src="assets/foo.png".
# With directory URLs (the MkDocs default), pages served at /lockbox/bom/ resolve
# those to /lockbox/bom/assets/ instead of /lockbox/assets/. Flat .html URLs
# keep sibling asset/ paths working for both raw HTML and markdown images.
use_directory_urls: false

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: cyan

hooks:
  - scripts/mkdocs_hooks.py

plugins:
  - search
  - awesome-pages

extra_css:
  - stylesheets/assembly.css

extra_javascript:
  - path: https://kicanvas.org/kicanvas/kicanvas.js
    type: module
  - javascripts/kicanvas-full-window.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - md_in_html

# Navigation is driven by .pages files (mkdocs-awesome-pages-plugin).
# Top-level order/titles live in docs/.pages. Product sections under
# docs/dtt, docs/lockbox, docs/ossm are CI-assembled from each product
# repo's assembly-docs/ folder (its nav.yml is translated into a .pages
# file by scripts/assemble-docs.sh) — do not edit those paths by hand.
