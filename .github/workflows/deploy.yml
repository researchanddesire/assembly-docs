name: Deploy assembly docs

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/**'
  repository_dispatch:
    types: [assembly-docs-rebuild]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      # Per-repo read-only deploy keys (machine credentials, not a personal
      # token). Only written when the secret is set; the assemble script falls
      # back to anonymous HTTPS, which is all that's needed once the repos are
      # public at cutover.
      - name: Write deploy keys for private OSS forks
        env:
          KEY_LOCKBOX: ${{ secrets.ASSEMBLE_SSH_KEY_LOCKBOX }}
          KEY_DTT: ${{ secrets.ASSEMBLE_SSH_KEY_DTT }}
          KEY_RADR: ${{ secrets.ASSEMBLE_SSH_KEY_RADR }}
          KEY_OSSM: ${{ secrets.ASSEMBLE_SSH_KEY_OSSM }}
        run: |
          mkdir -p "$RUNNER_TEMP/assemble-keys"
          if [ -n "$KEY_LOCKBOX" ]; then printf '%s\n' "$KEY_LOCKBOX" > "$RUNNER_TEMP/assemble-keys/Lockbox-OSS"; fi
          if [ -n "$KEY_DTT" ];     then printf '%s\n' "$KEY_DTT"     > "$RUNNER_TEMP/assemble-keys/DT_Trainer-OSS"; fi
          if [ -n "$KEY_RADR" ];    then printf '%s\n' "$KEY_RADR"    > "$RUNNER_TEMP/assemble-keys/RADR-OSS"; fi
          if [ -n "$KEY_OSSM" ];    then printf '%s\n' "$KEY_OSSM"    > "$RUNNER_TEMP/assemble-keys/ossm"; fi
          chmod 600 "$RUNNER_TEMP/assemble-keys/"* 2>/dev/null || true

      - name: Assemble product assembly-docs
        env:
          ASSEMBLE_SSH_DIR: ${{ runner.temp }}/assemble-keys
          ASSEMBLE_GITHUB_TOKEN: ${{ secrets.ASSEMBLE_GITHUB_TOKEN }}
        run: |
          chmod +x scripts/assemble-docs.sh
          ./scripts/assemble-docs.sh

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install MkDocs
        run: pip install -r requirements.txt

      - name: Build
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publish:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
